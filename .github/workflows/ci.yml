# 自动编译：每个 PR（含后续推送）和推到 main 时编译并跑测试。
# 不监听其他分支的 push：PR 分支的推送已由 pull_request 触发，再监听会重复跑两遍。
# 推到 main 时 release.yml 另外负责打包发版，这里只给 main 一个独立的编译状态。
#
# 只编译 .NET 项目、跑单元测试、检查中文文档；不拉 can-audio、不跑 PyInstaller、
# 不打单文件包——那些在 release.yml 里，手动触发 release.yml 可以试整包。

name: 编译与测试

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一个分支/PR 有新推送时取消旧的运行
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  PYTHONUTF8: '1'

jobs:
  build:
    name: .NET 编译与单元测试
    # NativeAudio.dll、Windows 音频相关代码只在 Windows 上完整可用
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原依赖
        run: dotnet restore src/CanAtis.Desktop.Tests/CanAtis.Desktop.Tests.csproj

      - name: 编译
        # 用默认的 Debug：Release 配置给桌面项目开了 SelfContained，不带 -r 构建会报 NETSDK1031
        run: dotnet build src/CanAtis.Desktop.Tests/CanAtis.Desktop.Tests.csproj --no-restore

      - name: 单元测试
        run: dotnet test src/CanAtis.Desktop.Tests/CanAtis.Desktop.Tests.csproj --no-build --logger "trx;LogFileName=test-results.trx"

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/CanAtis.Desktop.Tests/TestResults/*.trx
          if-no-files-found: ignore

  docs:
    name: 中文文档检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: 装文档依赖
        run: python -m pip install -r doc/requirements.txt

      - name: 生成的 HTML 与 Markdown 一致
        # 改了 doc/content/ 却没重新生成 HTML 时失败
        run: |
          python doc/build.py
          git diff --exit-code -- doc ':!doc/releases' || {
            echo "::error::doc/ 下的 HTML 不是最新的，请运行 python doc/build.py 后提交"
            exit 1
          }

      - name: 链接与锚点检查
        run: python doc/build.py --check
